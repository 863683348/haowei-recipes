name: Manual IndexNow Resubmit

# 手动触发：批量重提所有 /recipes/ URL 到 Bing
# 适用场景：sitemap 变更后想强制 Bing 重新抓取

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Site host (default: haoweirecipes.com)"
        required: false
        default: "haoweirecipes.com"
      url_pattern:
        description: "URL pattern to enumerate (default: /recipes/)"
        required: false
        default: "/recipes/"

permissions:
  contents: read

jobs:
  resubmit:
    name: "Resubmit all URLs to IndexNow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Resubmit
        run: |
          node scripts/indexnow-submit.mjs \
            --host "${{ inputs.host }}" \
            --key "$INDEXNOW_KEY" \
            --url-pattern "${{ inputs.url_pattern }}" \
            --from-sitemap "public/sitemap.xml"