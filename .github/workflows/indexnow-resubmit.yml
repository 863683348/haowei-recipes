name: Manual IndexNow Resubmit

# 手动触发：全量重提线上所有 URL 到 Bing
# 适用场景：sitemap 大改后想强制 Bing 重新抓取
# 注意：抓的是线上 sitemap（动态路由生成），不是本地文件

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Site host (default: haoweirecipes.com)"
        required: false
        default: "haoweirecipes.com"

permissions:
  contents: read

jobs:
  resubmit:
    name: "Resubmit all URLs to IndexNow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || '0f3d1de947cbc476896ac5db4863f64a' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Fetch live sitemap + resubmit
        run: |
          curl -s "https://${{ inputs.host }}/sitemap.xml" -o /tmp/sm.xml
          echo "📊 线上 sitemap URL 总数: $(grep -c '<loc>' /tmp/sm.xml)"
          node scripts/indexnow-submit.mjs \
            --host "${{ inputs.host }}" \
            --key "$INDEXNOW_KEY" \
            --from-sitemap /tmp/sm.xml
